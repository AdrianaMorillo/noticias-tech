<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech & Science Daily | News</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <header class="py-4 border-bottom border-warning mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0 text-warning"><i class="fas fa-microchip me-2"></i>Tech&Science <span class="text-white">Hub</span></h1>
            <button id="downloadBtn" class="btn btn-warning fw-bold">
                <i class="fas fa-file-download me-2"></i>Descargar Top 10 TXT
            </button>
        </div>
    </header>

    <main class="container mb-5">
        <div id="newsContainer" class="row g-4">
            <!-- Las tarjetas se cargarán aquí dinámicamente -->
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2">Cargando las últimas noticias...</p>
            </div>
        </div>
    </main>

    <script type="module" src="/main.js"></script>
</body>
</html>
